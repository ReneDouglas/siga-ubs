services:
  gateway:
    image: nginx:1.27.5-alpine
    container_name: sigaubs-gateway-prd
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/prd.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    networks:
      - edge
      - application
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,uid=101,gid=101,mode=0750
      - /run:rw,noexec,nosuid,uid=101,gid=101,mode=0750
      - /tmp:rw,noexec,nosuid,uid=101,gid=101,mode=1770
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "7"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  mysql:
    image: mysql:8.0.43
    container_name: sigaubs-mysql-prd
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env.prd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sigaubs}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no arquivo .env.prd}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env.prd}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - sigaubs_mysql_prd_data:/var/lib/mysql
      - ./docker/mysql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/sigaubs.cnf:ro
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
      - /var/run/mysqld:rw,noexec,nosuid,uid=999,gid=999
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile.prd
    container_name: sigaubs-app-prd
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
      - "9090"
    environment:
      SPRING_PROFILES_ACTIVE: prd
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-sigaubs}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?Defina MYSQL_USER no arquivo .env.prd}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env.prd}
      SIGAUBS_TENANCY_BASE_DOMAIN: ${SIGAUBS_TENANCY_BASE_DOMAIN:-sigaubs.com.br}
      SIGAUBS_CONTEMPLATION_JOB_LEASE_DURATION: ${SIGAUBS_CONTEMPLATION_JOB_LEASE_DURATION:-30m}
    networks:
      - application
      - database
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "7"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

volumes:
  sigaubs_mysql_prd_data:
    name: sigaubs_mysql_prd_data
    external: true

networks:
  edge:
  application:
    internal: true
  database:
    internal: true
