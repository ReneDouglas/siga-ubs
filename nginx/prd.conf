worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 20M;

    map $host $tenant_slug {
        default "";
        ~^([a-z0-9-]+)\.sigaubs\.com\.br$ $1;
    }

    upstream sigaubs_app {
        server app:8080;
    }

    server {
        listen 80;
        server_name sigaubs.com.br *.sigaubs.com.br;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name sigaubs.com.br;

        ssl_certificate /etc/nginx/ssl/sigaubs.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/sigaubs.com.br/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        return 404;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name *.sigaubs.com.br;

        ssl_certificate /etc/nginx/ssl/sigaubs.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/sigaubs.com.br/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            proxy_pass http://sigaubs_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Tenant-Slug $tenant_slug;
        }
    }
}
