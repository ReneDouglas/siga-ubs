worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format security '$remote_addr - $request_method $uri $server_protocol '
                        '$status $body_bytes_sent rt=$request_time '
                        'upstream=$upstream_response_time host=$host cf_ray=$http_cf_ray';
    access_log /dev/stdout security;
    error_log /dev/stderr warn;

    # Lista oficial verificada em https://www.cloudflare.com/ips/.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    geo $realip_remote_addr $from_cloudflare {
        default 0;
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;
        2400:cb00::/32 1;
        2606:4700::/32 1;
        2803:f800::/32 1;
        2405:b500::/32 1;
        2405:8100::/32 1;
        2a06:98c0::/29 1;
        2c0f:f248::/32 1;
    }

    map $host $tenant_slug {
        default "";
        "~^(?<mapped_tenant>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.sigaubs\.com\.br$" $mapped_tenant;
    }

    limit_req_zone $binary_remote_addr$host zone=general:20m rate=30r/s;
    limit_req_zone $binary_remote_addr$host zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=login_global:10m rate=30r/m;
    limit_req_zone $binary_remote_addr$host zone=reauth:10m rate=10r/m;
    map $request_method $write_limit_key {
        default "";
        POST $binary_remote_addr$host;
        PUT $binary_remote_addr$host;
        PATCH $binary_remote_addr$host;
        DELETE $binary_remote_addr$host;
    }
    limit_req_zone $write_limit_key zone=writes:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream sigaubs_app {
        server app:8080;
        keepalive 32;
    }

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Tenant-Slug $tenant_slug;
    # Somente os valores recebidos da borda Cloudflare chegam à aplicação.
    # Os nomes internos são sobrescritos para impedir spoof pelo cliente.
    proxy_set_header X-SIGAUBS-Location-City $http_cf_ipcity;
    proxy_set_header X-SIGAUBS-Location-Region-Code $http_cf_region_code;
    proxy_set_header X-SIGAUBS-Location-Region $http_cf_region;
    proxy_set_header X-SIGAUBS-Location-Country $http_cf_ipcountry;
    # Coordenadas, CEP e metadados não necessários são descartados na borda.
    proxy_set_header CF-IPCity "";
    proxy_set_header CF-Region-Code "";
    proxy_set_header CF-Region "";
    proxy_set_header CF-IPCountry "";
    proxy_set_header CF-IPLatitude "";
    proxy_set_header CF-IPLongitude "";
    proxy_set_header CF-IPContinent "";
    proxy_set_header CF-Postal-Code "";
    proxy_set_header CF-Metro-Code "";
    proxy_set_header CF-Timezone "";
    proxy_set_header Connection "";

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name "~^(?<redirect_tenant>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.sigaubs\.com\.br$";
        if ($from_cloudflare = 0) { return 444; }
        return 301 https://$redirect_tenant.sigaubs.com.br$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;
        ssl_certificate /etc/nginx/ssl/sigaubs.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/sigaubs.com.br/privkey.pem;
        return 444;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name "~^(?<validated_tenant>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.sigaubs\.com\.br$";
        if ($from_cloudflare = 0) { return 444; }

        ssl_certificate /etc/nginx/ssl/sigaubs.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/sigaubs.com.br/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        client_max_body_size 1m;
        client_body_timeout 15s;
        client_header_timeout 15s;
        keepalive_timeout 30s;
        send_timeout 60s;
        limit_conn connections 20;
        limit_req zone=general burst=60 nodelay;
        limit_req zone=writes burst=20 nodelay;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store, private" always;

        location = /login {
            limit_req zone=login burst=5 nodelay;
            limit_req zone=login_global burst=20 nodelay;
            proxy_pass http://sigaubs_app;
        }

        location = /admin/login {
            limit_req zone=login burst=5 nodelay;
            limit_req zone=login_global burst=20 nodelay;
            proxy_pass http://sigaubs_app;
        }

        location = /systemUser-management/validate {
            limit_req zone=reauth burst=5 nodelay;
            proxy_pass http://sigaubs_app;
        }

        location / {
            proxy_pass http://sigaubs_app;
        }
    }
}
