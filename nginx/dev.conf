worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format security '$remote_addr - $request_method $uri $server_protocol '
                        '$status $body_bytes_sent rt=$request_time '
                        'upstream=$upstream_response_time host=$host';
    access_log /dev/stdout security;
    error_log /dev/stderr warn;

    limit_req_zone $binary_remote_addr$host zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr$host zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=login_global:10m rate=30r/m;
    limit_req_zone $binary_remote_addr$host zone=reauth:10m rate=10r/m;
    map $request_method $write_limit_key {
        default "";
        POST $binary_remote_addr$host;
        PUT $binary_remote_addr$host;
        PATCH $binary_remote_addr$host;
        DELETE $binary_remote_addr$host;
    }
    limit_req_zone $write_limit_key zone=writes:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $host $tenant_slug {
        default "";
        "~^(?<local_tenant>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.localhost$" $local_tenant;
    }

    upstream sigaubs_app {
        server app:8080;
        keepalive 16;
    }

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Tenant-Slug $tenant_slug;
    # Sobrescreve qualquer tentativa do cliente; o perfil dev usa marcador local.
    proxy_set_header X-SIGAUBS-Location-City "";
    proxy_set_header X-SIGAUBS-Location-Region-Code "";
    proxy_set_header X-SIGAUBS-Location-Region "";
    proxy_set_header X-SIGAUBS-Location-Country "";
    proxy_set_header Connection "";

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name localhost;
        return 404;
    }

    server {
        listen 80;
        server_name "~^(?<validated_tenant>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.localhost$";

        client_max_body_size 1m;
        client_body_timeout 15s;
        client_header_timeout 15s;
        keepalive_timeout 30s;
        send_timeout 60s;
        limit_conn connections 20;
        limit_req zone=general burst=60 nodelay;
        limit_req zone=writes burst=20 nodelay;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store, private" always;

        location = /login {
            limit_req zone=login burst=5 nodelay;
            limit_req zone=login_global burst=20 nodelay;
            proxy_pass http://sigaubs_app;
        }

        location = /admin/login {
            limit_req zone=login burst=5 nodelay;
            limit_req zone=login_global burst=20 nodelay;
            proxy_pass http://sigaubs_app;
        }

        location = /systemUser-management/validate {
            limit_req zone=reauth burst=5 nodelay;
            proxy_pass http://sigaubs_app;
        }

        location / {
            proxy_pass http://sigaubs_app;
        }
    }
}
