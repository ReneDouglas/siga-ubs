spring.datasource.url=jdbc:h2:mem:sigaubs;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.task.scheduling.enabled=false
spring.cache.type=none
gg.jte.developmentMode=true
sigaubs.tenancy.base-domain=sigaubs.com.br
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
server.servlet.session.cookie.name=SIGAUBS_TEST_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
sigaubs.security.session.location-source=local
management.server.port=0
