# =============================================================================
# CONFIGURAÇÕES DE DESENVOLVIMENTO
# =============================================================================

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/sigaubs
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# HikariCP
spring.datasource.hikari.minimumIdle=0

# JTE — hot reload em desenvolvimento
gg.jte.developmentMode=true
gg.jte.usePrecompiledTemplates=false
gg.jte.templateLocation=src/main/jte
spring.web.resources.cache.period=0

# Hibernate SQL logging (dev)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# Spring logging (dev)
logging.level.org.springframework.security=DEBUG
logging.level.web=DEBUG

# Observability (dev — apenas health)
management.endpoints.web.exposure.include=health

# Multi-tenant local: http://{tenant}.localhost
sigaubs.tenancy.base-domain=localhost
