# =============================================================================
# CONFIGURAÇÕES DE DESENVOLVIMENTO
# =============================================================================

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/sigaubs
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# HikariCP
spring.datasource.hikari.minimumIdle=0

# JTE — hot reload em desenvolvimento
gg.jte.developmentMode=true
gg.jte.usePrecompiledTemplates=false
gg.jte.templateLocation=src/main/jte
spring.web.resources.cache.period=0

# Hibernate SQL logging (dev)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=off

# Spring logging (dev)
logging.level.org.springframework.security=DEBUG
logging.level.web=DEBUG

# Observability (dev - inspeção manual e endpoint Prometheus local)
management.endpoints.web.exposure.include=health,metrics,caches,prometheus
server.servlet.session.cookie.name=SIGAUBS_SESSION
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m
sigaubs.security.session.tenant-idle=12h
sigaubs.security.session.admin-idle=2h
sigaubs.security.session.tenant-absolute=72h
sigaubs.security.session.admin-absolute=12h
sigaubs.security.session.reauthentication=5m
sigaubs.security.session.location-source=local

# Multi-tenant local: http://{tenant}.localhost
sigaubs.tenancy.base-domain=localhost
