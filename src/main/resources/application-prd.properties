# =============================================================================
# CONFIGURAÇÕES DE PRODUÇÃO (Docker)
# =============================================================================

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Database — sobrescrito por SPRING_DATASOURCE_URL / SPRING_DATASOURCE_* no docker-compose
spring.datasource.url=jdbc:mysql://localhost:3306/sigaubs
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# HikariCP
spring.datasource.hikari.minimumIdle=2

# JTE — templates precompilados em produção
gg.jte.developmentMode=false
gg.jte.usePrecompiledTemplates=true

# Hibernate — batch com ordenação para agrupamento efetivo
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Spring logging (prd)
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%C{0}:%L] :: %msg%n%throwable

# Observability
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true

# Multi-tenant produção: https://{tenant}.sigaubs.com.br
sigaubs.tenancy.base-domain=sigaubs.com.br
