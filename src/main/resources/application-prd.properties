# =============================================================================
# CONFIGURAÇÕES DE PRODUÇÃO (Docker)
# =============================================================================

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Database — sobrescrito por SPRING_DATASOURCE_URL / SPRING_DATASOURCE_* no docker-compose
spring.datasource.url=jdbc:mysql://localhost:3306/sigaubs
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# HikariCP
spring.datasource.hikari.minimumIdle=2

# JTE — templates precompilados em produção
gg.jte.developmentMode=false
gg.jte.usePrecompiledTemplates=true

# Hibernate — batch com ordenação para agrupamento efetivo
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Spring logging (prd)
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%C{0}:%L] :: %msg%n%throwable

# Observability (prd - endpoint pronto para scrape Prometheus)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true

# Sessão/cookie de produção. Não definir Domain preserva o isolamento por host.
server.servlet.session.cookie.name=__Host-SIGAUBS_SESSION
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
sigaubs.security.session.tenant-idle=12h
sigaubs.security.session.admin-idle=2h
sigaubs.security.session.tenant-absolute=72h
sigaubs.security.session.admin-absolute=12h
sigaubs.security.session.reauthentication=5m
sigaubs.security.session.location-source=trusted-proxy

# Multi-tenant produção: https://{tenant}.sigaubs.com.br
sigaubs.tenancy.base-domain=sigaubs.com.br
